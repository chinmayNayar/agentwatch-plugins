name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GO_VERSION: "1.27.3"
  CLAUDE_CODE_VERSION: "2.1.329"
  CLAUDE_CODE_OLDEST: "2.1.197"

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l ./cmd ./internal ./tools)"
      - run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
        env:
          AGENTWATCH_TEST_KEYCHAIN: ${{ runner.os == 'macOS' && '1' || '' }}
      - name: test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
        env:
          AGENTWATCH_TEST_KEYCHAIN: "1"
      - name: PowerShell shim parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'plugins/claude-code/scripts/aw.ps1','plugins/cursor/scripts/aw.ps1') {
            $tokens = $null; $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errs)
            if ($errs.Count) { throw "$f : $errs" }
          }

  shims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n plugins/claude-code/scripts/aw.sh && sh -n plugins/cursor/scripts/aw.sh
      - name: shims are identical in both plugins
        run: |
          cmp plugins/claude-code/scripts/aw.sh plugins/cursor/scripts/aw.sh
          cmp plugins/claude-code/scripts/aw.ps1 plugins/cursor/scripts/aw.ps1
          cmp plugins/claude-code/scripts/checksums.txt plugins/cursor/scripts/checksums.txt
      - name: no OS junk in plugin folders
        run: test -z "$(find plugins -name .DS_Store -o -name Thumbs.db -o -name desktop.ini)"

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
      - run: claude plugin validate --strict ./plugins/claude-code
      - run: claude plugin validate --strict .
      - name: the oldest supported Claude Code accepts the plugin
        run: |
          npm install --prefix "$RUNNER_TEMP/cc-old" @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_OLDEST }}
          "$RUNNER_TEMP/cc-old/node_modules/.bin/claude" plugin validate ./plugins/claude-code

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: integration tests in a real VS Code
        run: xvfb-run -a npm run test:integration
      - name: integration tests on the oldest supported VS Code
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: "1.95.3"
      - name: package every target with zero vsce warnings
        run: |
          (cd ../.. && sh scripts/build-release.sh 0.0.0-ci dist)
          for t in darwin-arm64:darwin-arm64 darwin-x64:darwin-x64 linux-x64:linux-x64 linux-arm64:linux-arm64 win32-x64:windows-x64.exe; do
            target=${t%%:*}; bin=${t#*:}
            node scripts/package-target.mjs "$target" "../../dist/agentwatch-0.0.0-ci-$bin" vsix 2>&1 | tee pkg.log
            if grep -q "WARNING" pkg.log; then echo "vsce warning for $target"; exit 1; fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: screenshots render without errors
        run: |
          pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
          python test/screens/screens.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gitleaks (tree and full history)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          gitleaks git --redact --verbose .
          gitleaks dir --redact --verbose .
